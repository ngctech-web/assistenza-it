<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007aff"><title>Assistenza IT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}h1{margin:0;font-size:30px}
main{padding:16px 14px calc(100px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
button{font:inherit}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:#007aff;color:white;font-weight:700;font-size:17px}.secondary{padding:12px 15px;border:0;border-radius:12px;background:#e5e5ea}.danger{background:#ff3b30}
.row{display:flex;gap:10px}.row>*{flex:1}label{display:block;font-size:13px;color:#666;margin-top:8px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #c7c7cc;border-radius:11px;background:#fff;margin:5px 0 10px}
.item{padding:14px 4px;border-bottom:1px solid #eee}.item:last-child{border:0}.item button{border:0;background:transparent;text-align:left;width:100%;padding:0}.muted{color:#6e6e73}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5f7e8;color:#16821f;font-size:12px;font-weight:700}.timer{text-align:center;font-size:38px;font-weight:800;padding:15px 0}
.empty{text-align:center;color:#777;padding:25px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;background:#fff;border-top:1px solid #ddd;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;color:#666;padding:5px;font-size:12px}.tabs button.active{color:#007aff;font-weight:700}.stat{font-size:28px;font-weight:800}.meta{font-size:13px;color:#6e6e73}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#e5e5ea;font-size:12px;font-weight:700}.status.running{background:#e5f7e8;color:#16821f}.status.done{background:#e8eefc;color:#2456a6}

.signature{border:2px dashed #bbb;border-radius:12px;background:#fff;width:100%;height:180px;touch-action:none}
.sig-actions{display:flex;gap:8px;margin-top:8px}.sig-actions button{flex:1}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo-grid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}
.pdf-btn{background:#34c759}.print-only{display:none}
@media print{
 body{background:#fff}header,.tabs,.no-print{display:none!important}main{padding:0}
 .card{box-shadow:none;border:0;border-radius:0;page-break-inside:avoid}
 .print-only{display:block}
}
</style></head><body><header><h1>Assistenza IT</h1></header><main id="app"></main>
<nav class="tabs"><button id="tabHome" onclick="showTab('home')">⌂<br>Home</button><button id="tabClients" onclick="showTab('clients')">👥<br>Clienti</button><button id="tabInterventions" onclick="showTab('interventions')">🔧<br>Interventi</button></nav>
<script>
'use strict';
const KEY='assistenza_it_v1_1'; let state={clients:[],interventions:[]}, tab='home', current=null, timer=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.clients)&&Array.isArray(x.interventions))state=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Impossibile salvare i dati.')} }
function dataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function find(a,x){return a.find(v=>v.id===x)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function cname(id){const c=find(state.clients,id);return c?(c.company||c.name):'Cliente'}
function d(x){return new Date(x).toLocaleDateString('it-IT')}
function t(x){return new Date(x).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function sec(i){return i.start?Math.max(0,(i.end?Date.parse(i.end):Date.now())-Date.parse(i.start))/1000:0}
function dur(s){let m=Math.floor(s/60),h=Math.floor(m/60);return h+'h '+String(m%60).padStart(2,'0')+'m'}
function running(){return state.interventions.find(i=>i.start&&!i.end)}
function interventionNumber(i){
  if(!i.number){
    const years=new Date(i.date||Date.now()).getFullYear();
    const nums=state.interventions.map(x=>x.number).filter(Boolean).map(x=>parseInt(String(x).split('-').pop(),10)).filter(Number.isFinite);
    const n=(nums.length?Math.max(...nums):0)+1;
    i.number='INT-'+years+'-'+String(n).padStart(4,'0'); save();
  }
  return i.number;
}
function status(i){return i.end?'Completato':(i.start?'In corso':'Da iniziare')}
function showTab(x){tab=x;current=null;stop();render()}
function render(){['Home','Clients','Interventions'].forEach(x=>document.getElementById('tab'+x).classList.toggle('active',tab===x.toLowerCase()));if(tab==='home')home();else if(tab==='clients')clients();else interventions()}
function home(){const r=running(),a=document.getElementById('app');a.innerHTML='<div class="card">'+(r?'<span class="badge">● INTERVENTO IN CORSO</span><h2>'+esc(cname(r.clientId))+'</h2><div class="timer" id="timer">'+dur(sec(r))+'</div><button class="primary" id="open">Apri intervento</button>':'<h2>Nuovo intervento</h2><p class="muted">Registra automaticamente inizio, fine e durata dell’assistenza.</p><button class="primary" id="new">▶️ Nuovo intervento</button>')+'</div><div class="row"><div class="card"><div class="stat">'+state.clients.length+'</div><span class="muted">Clienti</span></div><div class="card"><div class="stat">'+state.interventions.length+'</div><span class="muted">Interventi</span></div></div>';if(r){document.getElementById('open').onclick=()=>open(r.id);startTimer(r,'timer')}else document.getElementById('new').onclick=()=>newIntervention()}
function clients(){const a=document.getElementById('app');a.innerHTML='<div class="card"><button class="primary" id="add">＋ Nuovo cliente</button></div><div class="card" id="list"></div>';document.getElementById('add').onclick=newClient;const l=document.getElementById('list');if(!state.clients.length){l.innerHTML='<div class="empty">Nessun cliente.</div>';return}l.innerHTML=state.clients.map(c=>'<div class="item"><button data-c="'+c.id+'"><b>'+esc(c.company||c.name)+'</b>'+(c.company?'<br><span class="muted">'+esc(c.name)+'</span>':'')+(c.phone?'<br><span class="muted">'+esc(c.phone)+'</span>':'')+'</button></div>').join('');l.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>clientDetail(b.dataset.c))}
function newClient(){
 const a=document.getElementById('app');
 a.innerHTML='<div class="card"><h2>Nuovo cliente</h2><form id="clientForm"><label>Nome / Referente</label><input id="clientNameInput" autocomplete="name" required><label>Azienda</label><input id="clientCompanyInput"><label>Telefono</label><input id="clientPhoneInput" type="tel" autocomplete="tel"><label>Email</label><input id="clientEmailInput" type="email" autocomplete="email"><label>Indirizzo</label><input id="clientAddressInput" autocomplete="street-address"><div class="row"><button type="button" class="secondary" id="cancelClient">Annulla</button><button type="submit" class="primary">Salva</button></div></form></div>';
 const form=document.getElementById('clientForm');
 document.getElementById('cancelClient').addEventListener('click',render);
 form.addEventListener('submit',function(event){event.preventDefault();saveClient();});
 document.getElementById('clientNameInput').focus();
}
function saveClient(){
 const name=document.getElementById('clientNameInput').value.trim();
 if(!name){alert('Inserisci il nome del cliente.');return}
 const client={
   id:id(),
   name:name,
   company:document.getElementById('clientCompanyInput').value.trim(),
   phone:document.getElementById('clientPhoneInput').value.trim(),
   email:document.getElementById('clientEmailInput').value.trim(),
   address:document.getElementById('clientAddressInput').value.trim()
 };
 state.clients.push(client);
 save();
 // Mostra subito il cliente appena creato.
 clientDetail(client.id);
}
function clientDetail(cid){const c=find(state.clients,cid),h=state.interventions.filter(i=>i.clientId===cid);document.getElementById('app').innerHTML='<div class="card"><h2>'+esc(c.company||c.name)+'</h2><p>'+[c.name!==c.company?c.name:'',c.phone,c.email,c.address].filter(Boolean).map(esc).join('<br>')+'</p><button class="primary" id="newc">＋ Nuovo intervento</button></div><div class="card"><h3>Storico interventi</h3>'+(h.length?h.map(i=>'<div class="item"><button data-i="'+i.id+'"><b>'+esc(interventionNumber(i))+'</b> · '+d(i.date)+'<br>'+esc(i.problem||'Intervento tecnico')+'<br><span class="muted">'+(i.end?dur(sec(i)):'In corso')+'</span></button></div>').join(''):'<div class="empty">Nessun intervento.</div>')+'</div>';newc.onclick=()=>newIntervention(cid);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(b.dataset.i))}
function newIntervention(pre){
 if(!state.clients.length){alert('Prima crea almeno un cliente.');showTab('clients');return}
 document.getElementById('app').innerHTML='<div class="card"><h2>Nuovo intervento</h2><form id="interventionForm"><label>Cliente</label><select id="clientSelect">'+state.clients.map(c=>'<option value="'+c.id+'" '+(c.id===pre?'selected':'')+'>'+esc(c.company||c.name)+'</option>').join('')+'</select><label>Problema</label><textarea id="problemInput" rows="3" placeholder="Descrizione del problema"></textarea><label>Note iniziali</label><textarea id="notesInput" rows="3"></textarea><button type="submit" class="primary">Crea intervento</button></form></div>';
 document.getElementById('interventionForm').addEventListener('submit',function(event){
   event.preventDefault();
   if(running()){alert('C’è già un intervento in corso.');return}
   const i={id:id(),clientId:document.getElementById('clientSelect').value,date:new Date().toISOString(),number:'',start:null,end:null,signature:'',photos:[],problem:document.getElementById('problemInput').value.trim(),workDone:'',materials:'',notes:document.getElementById('notesInput').value.trim()};
   state.interventions.unshift(i);save();open(i.id);
 });
}
function open(iid){
 current=iid;stop();
 const i=find(state.interventions,iid);if(!i)return;
 if(!i.number)interventionNumber(i);
 const a=document.getElementById('app');
 const photos=i.photos||[];
 a.innerHTML='<div class="card">'+
 '<div class="row" style="align-items:center"><div><span class="meta">'+esc(interventionNumber(i))+'</span></div><div style="text-align:right"><span class="status '+(i.start&&!i.end?'running':(i.end?'done':''))+'">'+esc(status(i))+'</span></div></div>'+
 '<h2>'+esc(cname(i.clientId))+'</h2><p>'+d(i.date)+'</p>'+
 (i.start?'<p><b>Inizio:</b> '+t(i.start)+(i.end?'<br><b>Fine:</b> '+t(i.end)+'<br><b>Durata:</b> '+dur(sec(i)):'')+'</p>':'')+
 (!i.start?'<button class="primary" id="start">▶️ INIZIA INTERVENTO</button>':(!i.end?'<div id="dt" class="timer">'+dur(sec(i))+'</div><button class="primary danger" id="end">⏹️ TERMINA INTERVENTO</button>':'') )+
 '</div>'+
 '<div class="card"><label>Problema</label><textarea id="ep" rows="3">'+esc(i.problem)+'</textarea><label>Attività eseguite</label><textarea id="wd" rows="4" placeholder="Cosa hai fatto?">'+esc(i.workDone)+'</textarea><label>Materiali</label><textarea id="ma" rows="3">'+esc(i.materials)+'</textarea><label>Note</label><textarea id="en" rows="3">'+esc(i.notes)+'</textarea><button class="secondary" id="sv">Salva modifiche</button></div>'+
 '<div class="card"><h3>📸 Foto intervento</h3><input id="photoInput" type="file" accept="image/*" multiple capture="environment"><div id="photoGrid" class="photo-grid">'+photos.map((p,n)=>'<img src="'+p+'" alt="Foto '+(n+1)+'">').join('')+'</div></div>'+
 '<div class="card"><h3>✍️ Firma cliente</h3><canvas id="signature" class="signature"></canvas><div class="sig-actions"><button class="secondary" id="clearSig">Cancella firma</button><button class="secondary" id="saveSig">Salva firma</button></div><p id="sigMsg" class="muted small">'+(i.signature?'Firma salvata.':'Firma non ancora salvata.')+'</p></div>'+
 (i.end?'<div class="card no-print"><button class="primary pdf-btn" id="pdf">📄 Genera / Stampa PDF</button><br><br><button class="primary" id="share">Condividi rapporto</button></div>':'');
 const s=document.getElementById('start'),e=document.getElementById('end');
 if(s)s.onclick=startInt;if(e)e.onclick=endInt;
 document.getElementById('sv').onclick=saveInt;
 document.getElementById('photoInput').addEventListener('change',async ev=>{
   const files=[...ev.target.files];
   if(!i.photos)i.photos=[];
   for(const f of files){if(f.type.startsWith('image/'))i.photos.push(await dataURL(f))}
   save();open(i.id);
 });
 const canvas=document.getElementById('signature'),ctx=canvas.getContext('2d');
 function resizeCanvas(){
   const ratio=Math.max(window.devicePixelRatio||1,1),r=canvas.getBoundingClientRect();
   const old=canvas.toDataURL();canvas.width=r.width*ratio;canvas.height=r.height*ratio;ctx.scale(ratio,ratio);ctx.lineWidth=2;ctx.lineCap='round';
   if(i.signature){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=i.signature}
 }
 resizeCanvas();
 let drawing=false;
 const point=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
 canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
 canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
 canvas.addEventListener('pointerup',()=>drawing=false);
 canvas.addEventListener('pointercancel',()=>drawing=false);
 document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);i.signature='';save();document.getElementById('sigMsg').textContent='Firma cancellata.'};
 document.getElementById('saveSig').onclick=()=>{i.signature=canvas.toDataURL('image/png');save();document.getElementById('sigMsg').textContent='Firma salvata.'};
 const pdf=document.getElementById('pdf');if(pdf)pdf.onclick=()=>window.print();
 const sh=document.getElementById('share');if(sh)sh.onclick=shareReport;
 if(i.start&&!i.end)startTimer(i,'dt');
}
function fields(i){i.problem=ep.value.trim();i.workDone=wd.value.trim();i.materials=ma.value.trim();i.notes=en.value.trim()}
function startInt(){const i=find(state.interventions,current);if(running()){alert('C’è già un intervento in corso.');return}fields(i);i.start=new Date().toISOString();save();open(i.id)}
function endInt(){const i=find(state.interventions,current);fields(i);i.end=new Date().toISOString();save();open(i.id)}
function saveInt(){const i=find(state.interventions,current);fields(i);save();alert('Modifiche salvate.')}
function startTimer(i,eid){stop();const e=document.getElementById(eid);if(!e)return;const f=()=>e.textContent=dur(sec(i));f();timer=setInterval(f,1000)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function interventions(){
 const a=document.getElementById('app');
 const items=state.interventions.map(i=>{
   const num=interventionNumber(i),st=status(i);
   return '<div class="item"><button data-i="'+i.id+'"><b>'+esc(num)+'</b> · '+esc(cname(i.clientId))+'<br><span class="muted">'+d(i.date)+' · '+esc(st)+'</span><br><span class="muted">'+esc(i.problem||'Intervento tecnico')+'</span></button></div>';
 }).join('');
 a.innerHTML='<div class="card">'+(state.interventions.length?items:'<div class="empty">Nessun intervento.</div>')+'</div>';
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(b.dataset.i));
}
function report(i){const c=find(state.clients,i.clientId);return 'RAPPORTO DI INTERVENTO\n\nNumero intervento: '+interventionNumber(i)+'\nFirma cliente: '+(i.signature?'Acquisita':'Non acquisita')+'\nFoto allegate: '+((i.photos||[]).length)+'\nCliente: '+(c?.company||c?.name||'')+'\nData: '+d(i.date)+'\nInizio: '+(i.start?t(i.start):'-')+'\nFine: '+(i.end?t(i.end):'-')+'\nDurata: '+(i.end?dur(sec(i)):'-')+'\n\nPROBLEMA\n'+i.problem+'\n\nATTIVITÀ ESEGUITE\n'+i.workDone+'\n\nMATERIALI\n'+i.materials+'\n\nNOTE\n'+i.notes}
function shareReport(){const text=report(find(state.interventions,current));if(navigator.share)navigator.share({title:'Rapporto di intervento',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('Rapporto copiato.'));else alert(text)}
load();render();
</script></body></html>
