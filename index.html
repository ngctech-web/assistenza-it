<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007aff"><title>Assistenza IT</title>
<style>
:root{
  --ngc-blue:#2d3491;
  --ngc-blue2:#3e49b8;
  --ngc-black:#111418;
  --ngc-bg:#f4f5f8;
  --ngc-card:#fff;
  --ngc-border:#e1e3e8;
  --ngc-muted:#69707d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ngc-bg);color:var(--ngc-black);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{
  background:#fff;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--ngc-border);
}
.ngc-header{display:flex;align-items:center;gap:12px;max-width:980px;margin:auto}
.ngc-logo{width:58px;height:58px;object-fit:contain}
.ngc-head-title{font-size:21px;font-weight:800;letter-spacing:-.02em}
.ngc-head-sub{font-size:12px;color:var(--ngc-muted);margin-top:2px}
main{max-width:980px;margin:auto;padding:18px 14px calc(105px + env(safe-area-inset-bottom))}
.card{
  background:var(--ngc-card);border:1px solid var(--ngc-border);
  border-radius:15px;padding:16px;margin-bottom:14px;
  box-shadow:0 4px 16px rgba(17,20,24,.055)
}
button{font:inherit;transition:.12s ease}
button:active{transform:scale(.98)}
.primary{
  width:100%;padding:14px;border:0;border-radius:11px;
  background:var(--ngc-blue);color:#fff;font-weight:750;font-size:17px;
  box-shadow:0 5px 13px rgba(45,52,145,.20)
}
.secondary{padding:12px 15px;border:1px solid var(--ngc-border);border-radius:11px;background:#f8f9fb;color:var(--ngc-black);font-weight:650}
.danger{background:#b42318}
.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;font-size:13px;color:#555d69;margin-top:8px;font-weight:650}
input,textarea,select{
  width:100%;font:inherit;font-size:16px;padding:12px;
  border:1px solid #cfd3da;border-radius:10px;background:#fff;margin:5px 0 10px;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:#7881d3;box-shadow:0 0 0 3px rgba(45,52,145,.10)}
.item{padding:15px 4px;border-bottom:1px solid #eceef2}.item:last-child{border:0}
.item button{border:0;background:transparent;text-align:left;width:100%;padding:0}
.muted{color:var(--ngc-muted)}
.badge,.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#eef0ff;color:var(--ngc-blue);font-size:12px;font-weight:750}
.badge:before,.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.timer{text-align:center;font-size:42px;font-weight:850;padding:18px 0;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ngc-blue)}
.empty{text-align:center;color:#777;padding:28px 10px}
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:#fff;
  border-top:1px solid var(--ngc-border);padding:7px 7px calc(7px + env(safe-area-inset-bottom))
}
.tabs button{flex:1;border:0;background:none;color:#69707d;padding:6px;font-size:12px}
.tabs button.active{color:var(--ngc-blue);font-weight:800}
.stat{font-size:28px;font-weight:850}.meta{font-size:13px;color:var(--ngc-muted)}
.status.running{background:#edf8f0;color:#19713a}.status.done{background:#eef2ff;color:#2d3491}
.signature{border:2px dashed #b8bdc8;border-radius:11px;background:#fff;width:100%;height:180px;touch-action:none}
.sig-actions{display:flex;gap:8px;margin-top:8px}.sig-actions button{flex:1}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photo-grid img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover}
.pdf-btn{background:#1f2937}.print-only{display:none}
.signature-preview{margin-top:10px;padding:10px;border:1px solid var(--ngc-border);border-radius:11px;background:#fff}
.signature-preview img{display:block;width:100%;height:100px;object-fit:contain;border-radius:8px}
.link-btn{border:0;background:transparent;color:var(--ngc-blue2);padding:8px 0;font-size:15px;font-weight:700}
.signature-overlay{display:none;position:fixed;inset:0;z-index:99999;background:#f4f5f8;overscroll-behavior:none}
.signature-overlay.open{display:block}
.signature-sheet{width:100%;height:100dvh;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));overflow:hidden}
.signature-top{display:flex;align-items:center;justify-content:space-between;min-height:46px}
.signature-hint{text-align:center;color:#666;font-size:14px;padding:8px 0 12px}
.signature-pad-wrap{position:relative;flex:1;min-height:220px;background:#fff;border:2px solid #c8ccd5;border-radius:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.signature-pad-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.signature-guide{position:absolute;left:0;right:0;top:54%;text-align:center;color:#c5cad3;font-size:28px;font-weight:600;pointer-events:none;transform:translateY(-50%)}
.signature-guide.hidden{display:none}
.signature-actions{display:flex;gap:10px;padding-top:12px}.signature-actions button{flex:1;min-height:50px;font-size:16px}
body.signature-lock{overflow:hidden!important;position:fixed;width:100%}
#v23Filters{margin-bottom:12px}
#v23Filters input,#v23Filters select{width:100%;box-sizing:border-box;margin:5px 0 9px}
#v23Filters .row{align-items:center}
#v23FilterCount{margin-left:auto}
#v23Filters label{display:block;margin-top:4px;font-size:14px;font-weight:650}
#v23Filters select,#v23Filters input{min-height:42px}
.client-stats{align-items:stretch}.client-stats .card{flex:1}
@media(max-width:520px){.client-stats .stat{font-size:24px}.ngc-logo{width:52px;height:52px}}
@media print{body{background:#fff}header,.tabs,.no-print{display:none!important}main{padding:0}.card{box-shadow:none;border:0;border-radius:0;page-break-inside:avoid}.print-only{display:block}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style id="v28-backup-css">
#v28BackupCard{margin-top:8px}
#v28BackupCard button{font-size:14px;font-weight:700;min-height:44px}
@media(min-width:700px){#v28BackupCard{max-width:520px}}
</style>


<style id="v29-css">
.v29-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-bottom:5px}
.v29-backup-fab{display:flex;justify-content:flex-end;margin:6px 0 18px}
.v29-backup-fab button{width:44px;height:44px;border:1px solid #e1e3e8;border-radius:13px;background:#fff;color:#2d3491;font-size:20px;box-shadow:0 4px 12px rgba(17,20,24,.08)}
.v29-backup-sheet{display:none;position:fixed;inset:0;z-index:10000;background:rgba(17,20,24,.35);align-items:flex-end;justify-content:center}
.v29-backup-sheet.open{display:flex}
.v29-backup-box{width:min(560px,100%);background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(17,20,24,.18)}
.v29-backup-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.v29-backup-head h3{margin:0 0 3px}.v29-muted{font-size:12px;color:#69707d}.v29-backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.v29-close{white-space:nowrap}
@media(max-width:520px){.v29-field-grid{grid-template-columns:1fr}.v29-backup-actions{grid-template-columns:1fr}}
</style>

<script>
'use strict';
const KEY='assistenza_it_v1_1'; let state={clients:[],interventions:[]}, tab='home', current=null, timer=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.clients)&&Array.isArray(x.interventions))state=x}catch(e){}}
function save(){
 try{
   localStorage.setItem(KEY,JSON.stringify(state));
   return true;
 }catch(e){
   console.error('Salvataggio localStorage fallito:',e);
   alert('Impossibile salvare i dati. La memoria del browser è piena. Le foto vengono ora ridotte automaticamente.');
   return false;
 }
}
function dataURL(file){
 return new Promise((resolve,reject)=>{
   if(!file||!file.type.startsWith('image/')){reject(new Error('File non immagine'));return}
   const r=new FileReader();
   r.onerror=reject;
   r.onload=()=>{
     const img=new Image();
     img.onerror=reject;
     img.onload=()=>{
       try{
         const max=1600;
         const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
         const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
         const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
         const c=document.createElement('canvas');c.width=w;c.height=h;
         const ctx=c.getContext('2d',{alpha:false});
         ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
         resolve(c.toDataURL('image/jpeg',0.72));
       }catch(e){reject(e)}
     };
     img.src=r.result;
   };
   r.readAsDataURL(file);
 })
}

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function find(a,x){return a.find(v=>v.id===x)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function cname(id){const c=find(state.clients,id);return c?(c.company||c.name):'Cliente'}
function d(x){return new Date(x).toLocaleDateString('it-IT')}
function t(x){return new Date(x).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function sec(i){return i.start?Math.max(0,(i.end?Date.parse(i.end):Date.now())-Date.parse(i.start))/1000:0}
function dur(s){let m=Math.floor(s/60),h=Math.floor(m/60);return h+'h '+String(m%60).padStart(2,'0')+'m'}
function running(){return state.interventions.find(i=>i.start&&!i.end)}
function interventionNumber(i){
  if(!i.number){
    const years=new Date(i.date||Date.now()).getFullYear();
    const nums=state.interventions.map(x=>x.number).filter(Boolean).map(x=>parseInt(String(x).split('-').pop(),10)).filter(Number.isFinite);
    const n=(nums.length?Math.max(...nums):0)+1;
    i.number='INT-'+years+'-'+String(n).padStart(4,'0'); save();
  }
  return i.number;
}
function status(i){return i.end?'Completato':(i.start?'In corso':'Da iniziare')}
function showTab(x){tab=x;current=null;stop();render()}
function render(){['Home','Clients','Interventions'].forEach(x=>document.getElementById('tab'+x).classList.toggle('active',tab===x.toLowerCase()));if(tab==='home')home();else if(tab==='clients')clients();else interventions()}
function home(){const r=running(),a=document.getElementById('app');a.innerHTML='<div class="card">'+(r?'<span class="badge">● INTERVENTO IN CORSO</span><h2>'+esc(cname(r.clientId))+'</h2><div class="timer" id="timer">'+dur(sec(r))+'</div><button class="primary" id="open">Apri intervento</button>':'<h2>Nuovo intervento</h2><p class="muted">Registra automaticamente inizio, fine e durata dell’assistenza.</p><button class="primary" id="new">▶️ Nuovo intervento</button>')+'</div><div class="row"><div class="card"><div class="stat">'+state.clients.length+'</div><span class="muted">Clienti</span></div><div class="card"><div class="stat">'+state.interventions.length+'</div><span class="muted">Interventi</span></div></div>';if(r){document.getElementById('open').onclick=()=>open(r.id);startTimer(r,'timer')}else document.getElementById('new').onclick=()=>newIntervention()}
function clients(){const a=document.getElementById('app');a.innerHTML='<div class="card"><button class="primary" id="add">＋ Nuovo cliente</button></div><div class="card" id="list"></div>';document.getElementById('add').onclick=newClient;const l=document.getElementById('list');if(!state.clients.length){l.innerHTML='<div class="empty">Nessun cliente.</div>';return}l.innerHTML=state.clients.map(c=>'<div class="item"><button data-c="'+c.id+'"><b>'+esc(c.company||c.name)+'</b>'+(c.company?'<br><span class="muted">'+esc(c.name)+'</span>':'')+(c.phone?'<br><span class="muted">'+esc(c.phone)+'</span>':'')+'</button></div>').join('');l.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>clientDetail(b.dataset.c))}
function newClient(){
 const a=document.getElementById('app');
 a.innerHTML='<div class="card"><h2>Nuovo cliente</h2><form id="clientForm"><label>Nome / Referente</label><input id="clientNameInput" autocomplete="name" required><label>Azienda</label><input id="clientCompanyInput"><label>Telefono</label><input id="clientPhoneInput" type="tel" autocomplete="tel"><label>Email</label><input id="clientEmailInput" type="email" autocomplete="email"><label>Indirizzo</label><input id="clientAddressInput" autocomplete="street-address"><div class="row"><button type="button" class="secondary" id="cancelClient">Annulla</button><button type="submit" class="primary">Salva</button></div></form></div>';
 const form=document.getElementById('clientForm');
 document.getElementById('cancelClient').addEventListener('click',render);
 form.addEventListener('submit',function(event){event.preventDefault();saveClient();});
 document.getElementById('clientNameInput').focus();
}
function saveClient(){
 const name=document.getElementById('clientNameInput').value.trim();
 if(!name){alert('Inserisci il nome del cliente.');return}
 const client={
   id:id(),
   name:name,
   company:document.getElementById('clientCompanyInput').value.trim(),
   phone:document.getElementById('clientPhoneInput').value.trim(),
   email:document.getElementById('clientEmailInput').value.trim(),
   address:document.getElementById('clientAddressInput').value.trim()
 };
 state.clients.push(client);
 save();
 // Mostra subito il cliente appena creato.
 clientDetail(client.id);
}
function clientDetail(cid){
 const c=find(state.clients,cid);
 const h=state.interventions.filter(i=>i.clientId===cid).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
 const completed=h.filter(i=>i.end).length;
 const openCount=h.filter(i=>!i.end).length;
 const last=h[0];
 const lastLabel=last?(interventionNumber(last)+' · '+d(last.date)):'Nessun intervento';
 document.getElementById('app').innerHTML='<div class="card"><h2>'+esc(c.company||c.name)+'</h2><p>'+[c.name!==c.company?c.name:'',c.phone,c.email,c.address].filter(Boolean).map(esc).join('<br>')+'</p><button class="primary" id="newc">＋ Nuovo intervento</button></div>'+
 '<div class="row client-stats"><div class="card"><div class="stat">'+h.length+'</div><span class="muted">Interventi totali</span></div><div class="card"><div class="stat">'+completed+'</div><span class="muted">Completati</span></div><div class="card"><div class="stat">'+openCount+'</div><span class="muted">Aperti</span></div></div>'+
 '<div class="card"><h3>🕘 Ultimo intervento</h3><p><b>'+esc(lastLabel)+'</b>'+(last?'<br>'+esc(last.problem||'Intervento tecnico'):'')+'</p></div>'+
 '<div class="card"><h3>Storico interventi</h3>'+(h.length?h.map(i=>'<div class="item"><button data-i="'+i.id+'"><b>'+esc(interventionNumber(i))+'</b> · '+d(i.date)+'<br>'+esc(i.problem||'Intervento tecnico')+'<br><span class="muted">'+(i.end?dur(sec(i)):'In corso')+'</span></button></div>').join(''):'<div class="empty">Nessun intervento.</div>')+'</div>';
 newc.onclick=()=>newIntervention(cid);
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(b.dataset.i))
}

 document.getElementById('interventionForm').addEventListener('submit',function(event){

function open(iid){
 current=iid;stop();
 const i=find(state.interventions,iid);if(!i)return;
 if(!i.number)interventionNumber(i);
 const a=document.getElementById('app');
 const photos=i.photos||[];
 a.innerHTML='<div class="card">'+
 '<div class="row" style="align-items:center"><div><span class="meta">'+esc(interventionNumber(i))+'</span></div><div style="text-align:right"><span class="status '+(i.start&&!i.end?'running':(i.end?'done':''))+'">'+esc(status(i))+'</span></div></div>'+
 '<h2>'+esc(cname(i.clientId))+'</h2><p>'+d(i.date)+'</p>'+
 (i.start?'<p><b>Inizio:</b> '+t(i.start)+(i.end?'<br><b>Fine:</b> '+t(i.end)+'<br><b>Durata:</b> '+dur(sec(i)):'')+'</p>':'')+
 (!i.start?'<button class="primary" id="start">▶️ INIZIA INTERVENTO</button>':(!i.end?'<div id="dt" class="timer">'+dur(sec(i))+'</div><button class="primary danger" id="end">⏹️ TERMINA INTERVENTO</button>':'') )+
 '</div>'+
 '<div class="card"><label>Problema</label><textarea id="ep" rows="3">'+esc(i.problem)+'</textarea><label>Attività eseguite</label><textarea id="wd" rows="4" placeholder="Cosa hai fatto?">'+esc(i.workDone)+'</textarea><label>Materiali</label><textarea id="ma" rows="3">'+esc(i.materials)+'</textarea><label>Note</label><textarea id="en" rows="3">'+esc(i.notes)+'</textarea><button class="secondary" id="sv">Salva modifiche</button></div>'+
 '<div class="card"><h3>📸 Foto intervento</h3><p class="muted" style="font-size:12px;margin-top:-5px">Le foto vengono ottimizzate automaticamente per essere salvate anche su iPhone.</p><div class="row"><button type="button" class="secondary" id="galleryBtn">🖼️ Galleria</button><button type="button" class="secondary" id="cameraBtn">📷 Fotocamera</button></div><input id="galleryInput" type="file" accept="image/*" multiple hidden><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><div id="photoGrid" class="photo-grid">'+photos.map((p,n)=>'<img src="'+p+'" alt="Foto '+(n+1)+'">').join('')+'</div></div>'+
 '<div class="card"><h3>✍️ Firma cliente</h3><button type="button" class="secondary" id="openSig">✍️ Firma cliente</button><div id="signaturePreview" class="signature-preview" style="'+(i.signature?'display:block':'display:none')+'">'+(i.signature?'<img src="'+i.signature+'" alt="Firma cliente">':'')+'<button type="button" class="link-btn" id="editSig">Modifica firma</button></div><p id="sigMsg" class="muted small">'+(i.signature?'Firma salvata.':'Firma non ancora salvata.')+'</p></div>'+
 (i.end?'<div class="card no-print"><button class="primary pdf-btn" id="pdf">📄 Genera / Stampa PDF</button><br><br><button class="primary" id="share">Condividi rapporto</button></div>':'');
 const s=document.getElementById('start'),e=document.getElementById('end');
 if(s)s.onclick=startInt;if(e)e.onclick=endInt;
 document.getElementById('sv').onclick=saveInt;
 async function addPhotos(fileList){
   const files=[...fileList];
   if(!i.photos)i.photos=[];
   const oldPhotos=[...i.photos];
   try{
     for(const f of files){
       if(f.type.startsWith('image/')) i.photos.push(await dataURL(f));
     }
     if(!save()){
       i.photos=oldPhotos;
       open(i.id);
       return;
     }
     open(i.id);
   }catch(err){
     console.error(err);
     i.photos=oldPhotos;
     alert('Non è stato possibile aggiungere la foto.');
     open(i.id);
   }
 }
 document.getElementById('galleryBtn').onclick=()=>document.getElementById('galleryInput').click();
 document.getElementById('cameraBtn').onclick=()=>document.getElementById('cameraInput').click();
 document.getElementById('galleryInput').addEventListener('change',e=>addPhotos(e.target.files));
 document.getElementById('cameraInput').addEventListener('change',e=>addPhotos(e.target.files));
 
 document.getElementById('openSig').onclick=()=>openSignature(i.id);
 document.getElementById('editSig').onclick=()=>openSignature(i.id);
 const pdf=document.getElementById('pdf');if(pdf)pdf.onclick=()=>generatePDF(i);
 const sh=document.getElementById('share');if(sh)sh.onclick=shareReport;
 if(i.start&&!i.end)startTimer(i,'dt');
}
function fields(i){i.problem=ep.value.trim();i.workDone=wd.value.trim();i.materials=ma.value.trim();i.notes=en.value.trim()}
function startInt(){const i=find(state.interventions,current);if(running()){alert('C’è già un intervento in corso.');return}fields(i);i.start=new Date().toISOString();save();open(i.id)}
function endInt(){const i=find(state.interventions,current);fields(i);i.end=new Date().toISOString();save();open(i.id)}
function saveInt(){const i=find(state.interventions,current);fields(i);save();alert('Modifiche salvate.')}
function startTimer(i,eid){stop();const e=document.getElementById(eid);if(!e)return;const f=()=>e.textContent=dur(sec(i));f();timer=setInterval(f,1000)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function interventions(){
 const a=document.getElementById('app');
 const items=state.interventions.map(i=>{
   const num=interventionNumber(i),st=status(i);
   return '<div class="item"><button data-i="'+i.id+'"><b>'+esc(num)+'</b> · '+esc(cname(i.clientId))+'<br><span class="muted">'+d(i.date)+' · '+esc(st)+'</span><br><span class="muted">'+esc(i.problem||'Intervento tecnico')+'</span></button></div>';
 }).join('');
 a.innerHTML='<div class="card">'+(state.interventions.length?items:'<div class="empty">Nessun intervento.</div>')+'</div>';
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(b.dataset.i));
}

function prepareSignatureCanvas(){const c=document.getElementById('signaturePad'),w=document.getElementById('signaturePadWrap');if(!c||!w)return;signatureCanvas=c;const r=w.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,3);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';signatureCtx=c.getContext('2d');signatureCtx.setTransform(dpr,0,0,dpr,0,0);signatureCtx.lineCap='round';signatureCtx.lineJoin='round';signatureCtx.strokeStyle='#111827';signatureCtx.lineWidth=Math.max(3,Math.min(5,r.width/90));const it=state.interventions.find(x=>x.id===signatureInterventionId);if(it&&it.signature){const img=new Image();img.onload=()=>{signatureCtx.clearRect(0,0,r.width,r.height);signatureCtx.drawImage(img,0,0,r.width,r.height);signatureHasInk=true;document.getElementById('signaturePadGuide').classList.add('hidden')};img.src=it.signature}else{signatureHasInk=false;document.getElementById('signaturePadGuide').classList.remove('hidden')}}
function sigPoint(e){const r=signatureCanvas.getBoundingClientRect();return{x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}}
function sigDown(e){if(!signatureCtx)return;e.preventDefault();try{signatureCanvas.setPointerCapture(e.pointerId)}catch(_){}const p=sigPoint(e);signatureDrawing=true;signatureHasInk=true;document.getElementById('signaturePadGuide').classList.add('hidden');signatureCtx.beginPath();signatureCtx.moveTo(p.x,p.y);signatureCtx.lineTo(p.x+.01,p.y+.01);signatureCtx.stroke()}
function sigMove(e){if(!signatureDrawing||!signatureCtx)return;e.preventDefault();const es=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():[e];for(const ev of es){const p=sigPoint(ev);signatureCtx.lineTo(p.x,p.y);signatureCtx.stroke();signatureCtx.beginPath();signatureCtx.moveTo(p.x,p.y)}}
function sigUp(e){if(!signatureDrawing)return;e.preventDefault();signatureDrawing=false;try{signatureCanvas.releasePointerCapture(e.pointerId)}catch(_){}}
function clearSignature(){if(!signatureCanvas||!signatureCtx)return;const r=signatureCanvas.getBoundingClientRect();signatureCtx.clearRect(0,0,r.width,r.height);signatureHasInk=false;document.getElementById('signaturePadGuide').classList.remove('hidden')}
function openSignature(id){signatureInterventionId=id;signatureScrollY=window.scrollY||0;signatureOldOverflow=document.body.style.overflow;signatureOldPosition=document.body.style.position;signatureOldTop=document.body.style.top;document.body.classList.add('signature-lock');document.body.style.position='fixed';document.body.style.top='-'+signatureScrollY+'px';const o=document.getElementById('signatureOverlay');o.classList.add('open');o.setAttribute('aria-hidden','false');requestAnimationFrame(()=>requestAnimationFrame(prepareSignatureCanvas))}
function closeSignature(){const o=document.getElementById('signatureOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');signatureDrawing=false;document.body.classList.remove('signature-lock');document.body.style.overflow=signatureOldOverflow;document.body.style.position=signatureOldPosition;document.body.style.top=signatureOldTop;window.scrollTo(0,signatureScrollY)}
function confirmSignature(){
 if(!signatureCanvas||!signatureHasInk){alert('Inserisci prima la firma del cliente.');return}
 const it=state.interventions.find(x=>x.id===signatureInterventionId);if(!it)return;
 const oldSignature=it.signature||'';
 try{

<script id="v28-backup-js">
(function(){
  const V28_BACKUP_VERSION=1;
  const V28_MAX_PHOTO=1280;
  const V28_MAX_SIGNATURE=900;

  function v28ImageDataUrl(dataUrl,maxSize,quality){
    return new Promise((resolve,reject)=>{
      if(!dataUrl || typeof dataUrl!=='string' || !dataUrl.startsWith('data:image/')){
        resolve(dataUrl); return;
      }
      const img=new Image();
      img.onload=()=>{
        try{
          const longest=Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height);
          const scale=Math.min(1,maxSize/Math.max(1,longest));
          const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
          const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
          const c=document.createElement('canvas');c.width=w;c.height=h;
          const ctx=c.getContext('2d',{alpha:false});
          ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',quality));
        }catch(e){reject(e)}
      };
      img.onerror=()=>resolve(dataUrl);
      img.src=dataUrl;
    });
  }

  async function v28CompactState(){
    const copy={clients:[],interventions:[]};
    copy.clients=JSON.parse(JSON.stringify(state.clients||[]));
    for(const original of (state.interventions||[])){
      const i=JSON.parse(JSON.stringify(original));
      if(Array.isArray(i.photos)){
        const photos=[];
        for(const p of i.photos){
          photos.push(await v28ImageDataUrl(p,V28_MAX_PHOTO,.66));
        }
        i.photos=photos;
      }
      if(i.signature){
        i.signature=await v28ImageDataUrl(i.signature,V28_MAX_SIGNATURE,.72);
      }
      copy.interventions.push(i);
    }
    return copy;
  }

  function v28Download(filename,textContent){
    const blob=new Blob([textContent],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  function v28Bytes(n){
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(0)+' KB';
    return (n/1024/1024).toFixed(2)+' MB';
  }

  async function v28Export(){
    const btn=document.getElementById('v28Export');
    const info=document.getElementById('v28BackupInfo');
    const old=btn.textContent;
    btn.disabled=true;btn.textContent='Preparazione...';info.textContent='';
    try{
      const compact=await v28CompactState();
      const payload={
        format:'assistenza-it-backup',
        version:V28_BACKUP_VERSION,
        exportedAt:new Date().toISOString(),
        app:'NGC-Tech Assistenza',
        state:compact
      };
      const text=JSON.stringify(payload);
      const d=new Date();
      const stamp=d.toISOString().slice(0,10);
      v28Download('NGC-Tech-Backup-'+stamp+'.json',text);
      info.textContent='Backup creato: '+v28Bytes(new Blob([text]).size);
    }catch(e){
      console.error(e);alert('Non è stato possibile creare il backup.');
    }finally{
      btn.disabled=false;btn.textContent=old;
    }
  }

  function v28ValidPayload(p){
    return p && p.format==='assistenza-it-backup' && p.state &&
      Array.isArray(p.state.clients) && Array.isArray(p.state.interventions);
  }

  async function v28Import(file){
    try{
      const text=await file.text();
      const payload=JSON.parse(text);
      if(!v28ValidPayload(payload)){throw new Error('Formato backup non valido');}
      const clients=payload.state.clients;
      const interventions=payload.state.interventions;
      const ok=confirm(
        'Importare questo backup?\\n\\n'+
        'Clienti: '+clients.length+'\\n'+
        'Interventi: '+interventions.length+'\\n\\n'+
        'I dati attuali verranno sostituiti. Prima assicurati di avere un backup recente.'
      );
      if(!ok)return;
      state={clients:clients,interventions:interventions};
      if(!save())throw new Error('Salvataggio locale non riuscito');
      alert('Backup importato correttamente.');
      location.reload();
    }catch(e){
      console.error(e);
      alert('Backup non valido o impossibile da importare.');
    }
  }

  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('v28Export')?.addEventListener('click',v28Export);
    document.getElementById('v28ImportBtn')?.addEventListener('click',()=>document.getElementById('v28Import')?.click());
    document.getElementById('v28Import')?.addEventListener('change',e=>{
      const file=e.target.files&&e.target.files[0]; if(file)v28Import(file);
      e.target.value='';
    });
  });
})();
</script>


<script id="v29-patch">
(function(){
  function defaults(i){
    if(!i)return;
    if(i.technician===undefined)i.technician='';
    if(i.type===undefined)i.type='';
    if(i.priority===undefined)i.priority='Normale';
    if(i.cost===undefined)i.cost='';
  }

  // Existing interventions remain compatible.
  document.addEventListener('DOMContentLoaded',function(){
    try{
      (state.interventions||[]).forEach(defaults);
      if(typeof save==='function') save();
    }catch(e){console.warn('V2.9 defaults',e)}
  });

  // When the existing intervention is created, capture the four new fields.
  // We wrap save only to attach the fields to the newest intervention; all
  // existing save behavior remains intact.
  const originalSave = window.save;
  if(typeof originalSave==='function'){
    window.save=function(){
      try{
        const list=state.interventions||[];
        if(list.length){
          const i=list[list.length-1];
          if(i && i._v29Pending){
            i.technician=document.getElementById('v29Technician')?.value.trim()||'';
            i.type=document.getElementById('v29Type')?.value||'';
            i.priority=document.getElementById('v29Priority')?.value||'Normale';
            i.cost=document.getElementById('v29Cost')?.value.trim()||'';
            delete i._v29Pending;
          }
        }
      }catch(e){}
      return originalSave.apply(this,arguments);
    };
  }

  // Backup UI delegates to the known-good V2.8 controls.
  document.addEventListener('DOMContentLoaded',function(){
    const sheet=document.getElementById('v29BackupSheet');
    const open=document.getElementById('v29BackupOpen');
    const close=document.getElementById('v29BackupClose');
    const exp=document.getElementById('v29Export');
    const impBtn=document.getElementById('v29ImportBtn');
    const imp=document.getElementById('v29Import');
    const oldExp=document.getElementById('v28Export');
    const oldImpBtn=document.getElementById('v28ImportBtn');
    const oldImp=document.getElementById('v28Import');
    const oldInfo=document.getElementById('v28BackupInfo');
    const info=document.getElementById('v29BackupInfo');

    open?.addEventListener('click',()=>{sheet.classList.add('open');sheet.setAttribute('aria-hidden','false')});
    close?.addEventListener('click',()=>{sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true')});
    sheet?.addEventListener('click',e=>{if(e.target===sheet)close.click()});

    exp?.addEventListener('click',()=>{
      if(oldExp){oldExp.click();setTimeout(()=>{info.textContent=oldInfo?.textContent||''},900)}
    });
    impBtn?.addEventListener('click',()=>imp?.click());
    imp?.addEventListener('change',()=>{
      if(oldImpBtn) oldImpBtn.click();
      // Transfer file after opening the native picker is not reliable on iOS;
      // instead dispatch directly on the original input.
      if(oldImp && imp.files?.[0]){
        try{
          const dt=new DataTransfer();dt.items.add(imp.files[0]);oldImp.files=dt.files;
          oldImp.dispatchEvent(new Event('change',{bubbles:true}));
        }catch(e){
          // Fallback: keep the working V2.8 import input visible.
          oldImp.style.display='block';
          oldImp.click();
        }
      }
      imp.value='';
    });
  });
})();
</script>
